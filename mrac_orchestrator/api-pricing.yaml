schema_version: 1
checked_on: '2026-10-02'
currency: USD
unit_tokens: 1000000
default_tier: standard
default_context: short
context_threshold_tokens: 272000
sources:
  - https://developers.openai.com/api/docs/pricing
  - https://developers.openai.com/api/docs/models/all
notes:
  - Standard reasoning mode; token fees only. Subscription charges are not used.
  - CLI usage is cumulative across API requests; short context is an explicit estimate assumption.
  - Long context is selected explicitly, never inferred from cumulative CLI input tokens.
  - GPT-5.6 Sol promotional rates are available at least through 2026-11-21.
