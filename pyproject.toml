[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mracbench"
version = "0.1.0"
description = "Single-case Spec-MRAC benchmark runner"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["mracbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
