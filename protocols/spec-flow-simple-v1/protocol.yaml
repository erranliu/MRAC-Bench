id: spec-flow-simple-v1
version: 5
artifact_type: spec
workflow: spec-init-freeze
stages:
  spec-init:
    prompt: spec-init.md
  spec-freeze-loop:
    prompt: spec-freeze-loop.md
  review:
    prompt: review.md
  repair-init:
    prompt: repair-init.md
  repair-freeze:
    prompt: repair-freeze.md
output_schemas:
  repair:
    type: object
    properties:
      spec:
        type: string
      fixes:
        type: array
        items:
          type: object
          properties:
            finding_id:
              type: string
            evidence:
              type: string
          required: [finding_id, evidence]
          additionalProperties: false
    required: [spec, fixes]
    additionalProperties: false
preflight:
  prompt: repository-read-check.md
convergence:
  type: consecutive_clean_audits
  required_clean_audits: 2
limits:
  max_audit_rounds: 8
